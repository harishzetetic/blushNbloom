<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Blush & Bloom</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>B&amp;B Admin Login</h2>
    <input type="text" id="loginUser" placeholder="Username (mobile number)">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="loginError" class="error-text"></p>
  </div>
</div>

<div id="dashboard" class="dashboard" style="display:none;">
  <header class="admin-header">
    <h2>Blush &amp; Bloom — Admin</h2>
    <button onclick="logout()" class="btn-outline">Logout</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="bookings">Bookings</button>
    <button class="tab-btn" data-tab="slots">Time Slots</button>
    <button class="tab-btn" data-tab="content">Landing Page</button>
  </nav>

  <section id="tab-bookings" class="tab-content active">
    <h3>All Bookings</h3>
    <div id="bookingsList" class="list"></div>
  </section>

  <section id="tab-slots" class="tab-content">
    <h3>Manage Time Slots</h3>
    <div id="slotsList" class="list"></div>
    <div class="add-form">
      <input type="text" id="newSlotLabel" placeholder="Label e.g. 5:00 PM - 6:00 PM">
      <input type="text" id="newSlotTime" placeholder="24hr start e.g. 17:00">
      <button onclick="addSlot()">Add Slot</button>
    </div>
  </section>

  <section id="tab-content" class="tab-content">
    <h3>Landing Page Content</h3>
    <div class="content-form" id="contentForm">
      <label>Hero Title</label>
      <input type="text" id="c_heroTitle">
      <label>Hero Subtitle</label>
      <input type="text" id="c_heroSubtitle">
      <label>Hero Image URL</label>
      <input type="text" id="c_heroImage">
      <label>Contact Phone</label>
      <input type="text" id="c_contactPhone">
      <label>Contact Address</label>
      <input type="text" id="c_contactAddress">
      <label>Contact Email</label>
      <input type="text" id="c_contactEmail">
      <button onclick="saveContent()">Save Content</button>
      <p id="contentSaveMsg" class="success-text"></p>
    </div>
  </section>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
